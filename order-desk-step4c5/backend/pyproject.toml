[project]
name = "orderdesk-backend"
version = "0.1.0"
description = "The modular Django backend for the Order Desk application."
requires-python = ">=3.14,<3.15"
dependencies = [
    "Django==5.2.17",
    "djangorestframework==3.18.1",
    "psycopg[binary]==3.3.6",
]

[dependency-groups]
dev = ["ruff==0.16.10"]

[tool.uv]
package = false
required-version = "==0.12.23"

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = ["apps/*/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "DJ"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*.py" = ["S106"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

