# Local development only. Preserve the project name and volume from Step 1.
name: orderdesk-local

x-backend: &backend
  image: orderdesk-backend:local
  working_dir: /app
  volumes:
    - ./backend:/app
    - ./frontend:/frontend:ro
    - document_data:/private-documents
  depends_on:
    db:
      condition: service_healthy
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-backend-environment: &backend-environment
  DJANGO_SETTINGS_MODULE: config.settings.local
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Run scripts/init_env.py first}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
  DATABASE_NAME: ${POSTGRES_DB:?Run scripts/init_env.py first}
  DATABASE_HOST: db
  DATABASE_PORT: "5432"
  DATABASE_SSLMODE: disable
  PRIVATE_DOCUMENT_ROOT: /private-documents

services:
  documentstorage:
    image: orderdesk-backend:local
    user: "0:0"
    volumes:
      - document_data:/private-documents
    command: [python, -c, "import os; os.chown('/private-documents', 10001, 10001); os.chmod('/private-documents', 0o700)"]
  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run scripts/init_env.py first}
      POSTGRES_USER: ${POSTGRES_USER:?Run scripts/init_env.py first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init_env.py first}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    <<: *backend
    depends_on:
      db:
        condition: service_healthy
      documentstorage:
        condition: service_completed_successfully
    build:
      context: ./backend
      target: development
    environment:
      <<: *backend-environment
      DATABASE_USER: ${DATABASE_APP_USER:-orderdesk_app}
      DATABASE_PASSWORD: ${DATABASE_APP_PASSWORD:?Run scripts/init_env.py first}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    init: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready/', timeout=5).close()"
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 15s
    stop_grace_period: 15s

  # Helpers run only when explicitly requested; they do not remain running.
  manage:
    <<: *backend
    profiles: [tools]
    command: [python, manage.py, check]
    environment:
      <<: *backend-environment
      DATABASE_USER: ${DATABASE_MIGRATION_USER:-orderdesk_migrator}
      DATABASE_PASSWORD: ${DATABASE_MIGRATION_PASSWORD:?Run scripts/init_env.py first}

  dbsetup:
    <<: *backend
    profiles: [tools]
    command: [python, scripts/bootstrap_database.py]
    environment:
      DATABASE_NAME: ${POSTGRES_DB:?Run scripts/init_env.py first}
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_ADMIN_USER: ${POSTGRES_USER:?Run scripts/init_env.py first}
      DATABASE_ADMIN_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init_env.py first}
      DATABASE_APP_USER: ${DATABASE_APP_USER:-orderdesk_app}
      DATABASE_APP_PASSWORD: ${DATABASE_APP_PASSWORD:?Run scripts/init_env.py first}
      DATABASE_MIGRATION_USER: ${DATABASE_MIGRATION_USER:-orderdesk_migrator}
      DATABASE_MIGRATION_PASSWORD: ${DATABASE_MIGRATION_PASSWORD:?Run scripts/init_env.py first}

  # Local-only, short-lived RLS verification. The API never receives these
  # owner credentials; this process populates only the dedicated test database.
  rlscheck:
    <<: *backend
    profiles: [tools]
    command: [python, manage.py, verify_catalog_rls]
    environment:
      <<: *backend-environment
      DATABASE_NAME: test_orderdesk
      DATABASE_USER: ${DATABASE_APP_USER:-orderdesk_app}
      DATABASE_PASSWORD: ${DATABASE_APP_PASSWORD:?Run scripts/init_env.py first}
      RLS_VERIFIER_OWNER_USER: ${DATABASE_MIGRATION_USER:-orderdesk_migrator}
      RLS_VERIFIER_OWNER_PASSWORD: ${DATABASE_MIGRATION_PASSWORD:?Run scripts/init_env.py first}

volumes:
  postgres_data:
  document_data:
