worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    # No query strings, cookie/auth headers, request bodies or source filenames.
    log_format safe '$request_id $request_method $status $request_time';
    access_log /dev/stdout safe;
    client_body_temp_path /tmp/body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 11m;
    client_body_timeout 15s;
    client_header_timeout 10s;
    send_timeout 30s;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /proxy-tls/server.crt;
    ssl_certificate_key /proxy-tls/server.key;
    map $uri $asset_cache {
        default "public, max-age=300";
        "~^/static/.+[.][0-9a-f]{12}[.][a-z]+$" "public, max-age=31536000, immutable";
    }
    server {
        listen 8080 default_server;
        server_name _;
        return 421;
    }
    server {
        listen 8080;
        server_name orderdesk.localhost;
        return 308 https://orderdesk.localhost:8443$request_uri;
    }
    server {
        listen 8443 ssl default_server;
        server_name _;
        return 421;
    }
    server {
        listen 8443 ssl;
        server_name orderdesk.localhost;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        add_header X-Request-ID $request_id always;
        add_header Strict-Transport-Security "max-age=60" always;
        location ~ ^/(media|private-documents|intake|exports)(/|$) { return 404; }
        location /static/ {
            alias /srv/static/;
            autoindex off;
            # Only content-hashed assets may have long-lived caching.
            add_header Cache-Control $asset_cache;
            add_header X-Content-Type-Options nosniff always;
        }
        location / {
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host orderdesk.localhost:8443;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 3s;
            proxy_read_timeout 35s;
            proxy_send_timeout 30s;
            proxy_buffering off;
            proxy_hide_header Cache-Control;
            proxy_hide_header Strict-Transport-Security;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Referrer-Policy;
            add_header Cache-Control "private, no-store" always;
            # add_header inheritance requires repeating the security headers.
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy same-origin always;
            add_header X-Request-ID $request_id always;
            add_header Strict-Transport-Security "max-age=60" always;
        }
    }
}
